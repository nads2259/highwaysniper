[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "highwaysniper"
version = "0.1.0"
description = "Contract-driven, independently deployable agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["agent_kernel*", "agent_os*", "adapters*", "evaluations*", "release*", "evolution*"]

[tool.pytest.ini_options]
testpaths = ["agent_kernel/tests", "evaluations"]
pythonpath = ["."]
